# what's connected, at a glance; the pc's brave opens it on every new tab
title: Overview
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4
    dense_section_placement: true
    header:
      layout: responsive
      card:
        type: markdown
        text_only: true
        content: >-
          # {{ 'Good night' if now().hour < 5 else 'Good morning' if now().hour < 12
          else 'Good afternoon' if now().hour < 18 else 'Good evening' }}

          {{ now().strftime('%A, %-d %B') }}
    badges:
      - type: entity
        entity: weather.forecast_home
        show_state: true
        color: state
      - type: entity
        entity: sensor.pixel_9_pro_xl_battery_level_2
        name: Phone
        show_name: true
        show_state: true
      - type: entity
        entity: sensor.speaker_crafty_battery
        name: Crafty
        show_name: true
        show_state: true
        visibility:
          - condition: state
            entity: sensor.speaker_crafty_battery
            state_not: [unavailable, unknown]
      - type: entity
        entity: sensor.homelab_failing_endpoints
        name: Endpoints down
        show_name: true
        show_state: true
        color: red
        tap_action:
          action: url
          url_path: https://uptime.nouritsu.com
        visibility:
          - condition: numeric_state
            entity: sensor.homelab_failing_endpoints
            above: 0
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Bedroom
            icon: mdi:bed
          - type: tile
            entity: light.table_light
            name: Table lamp
            features_position: inline
            features:
              - type: light-brightness
            grid_options:
              columns: 12
          - type: tile
            entity: light.bed_light
            name: Bed lamp
            features_position: inline
            features:
              - type: light-brightness
            grid_options:
              columns: 12
          - type: tile
            entity: light.tv_stand_lamp
            name: TV lamp
            features_position: inline
            features:
              - type: light-brightness
            grid_options:
              columns: 12
          - type: tile
            entity: scene.day
            name: Day
            hide_state: true
            tap_action: &day
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.day
            icon_tap_action: *day
          - type: tile
            entity: scene.night
            name: Night
            hide_state: true
            tap_action: &night
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.night
            icon_tap_action: *night
          - type: heading
            heading: TV
            heading_style: subtitle
            icon: mdi:television
          - type: tile
            entity: media_player.bedroom_tv
            name: TV stick
            state_content: [state, app_name]
            grid_options:
              columns: 12
          - type: tile
            entity: automation.lights_follow_the_tv
            name: Lamps follow the TV
            grid_options:
              columns: 12
          # the stick's jellyfin clients, only while one plays
          - type: media-control
            entity: media_player.bedroom_tv_moonfin
            visibility:
              - condition: state
                entity: media_player.bedroom_tv_moonfin
                state: [playing, paused]
          - type: media-control
            entity: media_player.bedroom_tv_jellyfin
            visibility:
              - condition: state
                entity: media_player.bedroom_tv_jellyfin
                state: [playing, paused]

      - type: grid
        cards:
          - type: heading
            heading: Music
            icon: mdi:music
          - type: media-control
            entity: media_player.spotify
          - type: tile
            entity: media_player.speaker
            name: Speaker
            features_position: inline
            features:
              - type: media-player-volume-slider
            grid_options:
              columns: 12
          # the housemates' sonos: state only, so a stray click plays nothing downstairs
          - type: tile
            entity: media_player.kuche
            name: Küche
          - type: tile
            entity: media_player.badezimmer_unten
            name: Bad unten

      - type: grid
        cards:
          - type: heading
            heading: Today
            icon: mdi:calendar-today
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: true
            show_forecast: true
          - type: tile
            entity: sensor.sun_next_rising
            name: Sunrise
            icon: mdi:weather-sunset-up
            time_format: time
          - type: tile
            entity: sensor.sun_next_setting
            name: Sunset
            icon: mdi:weather-sunset-down
            time_format: time
          - type: markdown
            content: >-
              {%- set bins = states.sensor.next_bins -%}
              {%- if bins and bins.attributes.daysTo is defined -%}
              {%- set days = bins.attributes.daysTo -%}
              <ha-icon icon="mdi:trash-can"></ha-icon> **{{ bins.state }}**
              {{ 'today' if days == 0 else 'tomorrow' if days == 1 else 'in ' ~ days ~ ' days' }}
              {%- endif -%}

      - type: grid
        cards:
          - type: heading
            heading: Devices
            icon: mdi:devices
          - type: tile
            entity: sensor.pixel_9_pro_xl_battery_level_2
            name: Phone
          - type: tile
            entity: sensor.pixel_9_pro_xl_battery_state_2
            name: Charging
          - type: tile
            entity: sensor.pixel_9_pro_xl_next_alarm_2
            name: Next alarm
            time_format: datetime
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.speaker_crafty_battery
            name: Crafty
          - type: tile
            entity: switch.speaker_mute
            name: Speaker muted
          - type: heading
            heading: Homelab
            heading_style: subtitle
            icon: mdi:server
            tap_action:
              action: url
              url_path: https://uptime.nouritsu.com
          - type: tile
            entity: sensor.homelab_failing_endpoints
            name: Endpoints down
            tap_action:
              action: url
              url_path: https://uptime.nouritsu.com
          - type: tile
            entity: sensor.homelab_active_clients
            name: Jellyfin clients
          - type: tile
            entity: sensor.system_monitor_processor_use
            name: CPU
            features:
              - type: trend-graph
                hours_to_show: 24
            grid_options:
              columns: 12
          - type: heading
            heading: Internet
            heading_style: subtitle
            icon: mdi:router-network
            badges:
              - type: entity
                entity: binary_sensor.internetgatewaydevicev2_fritz_box_5530_fiber_wan_status
                show_state: true
                color: state
          - type: tile
            entity: sensor.internetgatewaydevicev2_fritz_box_5530_fiber_download_speed
            name: Down
            icon: mdi:download
            features:
              - type: trend-graph
                hours_to_show: 24
          - type: tile
            entity: sensor.internetgatewaydevicev2_fritz_box_5530_fiber_upload_speed
            name: Up
            icon: mdi:upload
            features:
              - type: trend-graph
                hours_to_show: 24
