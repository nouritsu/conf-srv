default_config:

homeassistant:
  # one file per device or feature, from nixos-srv
  packages: !include_dir_named nix/packages

frontend:
  themes: !include_dir_merge_named themes

# beside the ui's own dashboards, which stay in storage
lovelace:
  dashboards:
    nix-overview:
      mode: yaml
      filename: nix/dashboards/overview.yaml
      title: Overview
      icon: mdi:view-dashboard

# the ui edits these three; nix/ holds the ones from nixos-srv
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
automation nix: !include nix/automations.yaml
scene nix: !include nix/scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
