# the bedroom speaker (github:nouritsu/ha-speaker): what it answers beyond
# Assist's own commands, what its LED ring flags, and its action key. The
# ring: magenta for a homelab service down, the bins' colours the afternoon
# before, orange for the Crafty running low, cyan once it's charged.
# It speaks German, so the stops and towns come out right: the sentences and
# answers below are German, and Speech-to-Phrase learns the sentences from
# Home Assistant itself, so they stay plain (no wildcards). Times are written
# "19 Uhr 26" for Piper to read them as a German would

rest_command:
  # departures from DBF (dbf.finalrewind.org), fetched only when asked for
  departures_burg:
    url: https://dbf.finalrewind.org/Bremen-Burg.json?version=3&limit=12
    timeout: 10
  departures_burgdammer_ring:
    url: https://dbf.finalrewind.org/Bremen%20Burgdammer%20Ring.json?hafas=VBN&version=3&limit=6
    timeout: 10
  departures_goldbergplatz:
    url: https://dbf.finalrewind.org/Bremen%20Goldbergplatz.json?hafas=VBN&version=3&limit=6
    timeout: 10
  # Gatus' last result per endpoint
  homelab_status:
    url: http://127.0.0.1:4000/api/v1/endpoints/statuses?page=1&pageSize=1
    timeout: 10

rest:
  - resource: http://127.0.0.1:4000/api/v1/endpoints/statuses?page=1&pageSize=1
    scan_interval: 300
    sensor:
      - name: Homelab failing endpoints
        unique_id: homelab_failing_endpoints
        icon: mdi:server-network-off
        value_template: >-
          {{ value_json | map(attribute='results') | map('last')
             | rejectattr('success') | list | count }}

sensor:
  # Die Bremer Stadtreinigung's next collection; its source, which names the
  # address, is in bins.yaml from sops
  - platform: waste_collection_schedule
    name: Next bins
    value_template: "{{ value.types | join(', ') }}"
    add_days_to: true
    details_format: hidden

template:
  - sensor:
      # comma-separated colors for the speaker's idle ring, or nothing
      - name: Speaker notice
        unique_id: speaker_notice
        icon: mdi:led-on
        state: >-
          {%- set ns = namespace(colors=[]) -%}
          {%- if states('sensor.homelab_failing_endpoints') | int(0) > 0 -%}
            {%- set ns.colors = ns.colors + ['#d500f9'] -%}
          {%- endif -%}
          {#- the bins, from the afternoon before -#}
          {%- set bins = states.sensor.next_bins -%}
          {%- if bins and bins.attributes.daysTo == 1 and now().hour >= 15 -%}
            {%- set palette = {'Restmüll': ['#ffffff'], 'Bioabfall': ['#33cc33'],
                 'Papier / Gelber Sack': ['#2979ff', '#ffd600'], 'Tannenbaumabfuhr': ['#00796b']} -%}
            {%- for kind in bins.state.split(', ') -%}
              {%- set ns.colors = ns.colors + palette.get(kind, ['#ffffff']) -%}
            {%- endfor -%}
          {%- endif -%}
          {%- set crafty = states.sensor.speaker_crafty_battery -%}
          {%- if crafty and crafty.state | is_number -%}
            {%- if crafty.state | int <= 15 -%}
              {%- set ns.colors = ns.colors + ['#ff6d00'] -%}
            {#- charged, for the two hours after it got there -#}
            {%- elif crafty.state | int >= 100 and now() - crafty.last_changed < timedelta(hours=2) -%}
              {%- set ns.colors = ns.colors + ['#00e5ff'] -%}
            {%- endif -%}
          {%- endif -%}
          {{ ns.colors | join(',') }}

script:
  # the lamps off ten minutes after "gute Nacht"; another "gute Nacht" restarts the wait
  speaker_good_night:
    alias: Speaker good night
    mode: restart
    sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.night
      - delay:
          minutes: 10
      - action: light.turn_off
        target:
          entity_id: [light.bed_light, light.table_light, light.tv_stand_lamp]

  # "Licht aus in zwanzig Minuten"; asking again restarts the wait
  speaker_lamps_off_later:
    alias: Speaker turns the lamps off later
    mode: restart
    fields:
      minutes:
        description: Minutes until the lamps go off
        example: 20
    sequence:
      - delay:
          minutes: "{{ minutes | int(30) }}"
      - action: light.turn_off
        target:
          entity_id: [light.bed_light, light.table_light, light.tv_stand_lamp]

automation:
  - id: "speaker_action_key_double_press"
    alias: Speaker action key toggles the lamps
    description: A double press on the speaker's action key turns the bedroom lamps off if any is on, else on as they were
    triggers:
      - trigger: state
        entity_id: event.speaker_action_key
        not_from: unavailable
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type == 'double_press' }}"
    actions:
      - if:
          - condition: state
            entity_id: [light.bed_light, light.table_light, light.tv_stand_lamp]
            match: any
            state: "on"
        then:
          - action: light.turn_off
            target:
              entity_id: [light.bed_light, light.table_light, light.tv_stand_lamp]
        else:
          - action: light.turn_on
            target:
              entity_id: [light.bed_light, light.table_light, light.tv_stand_lamp]

  - id: "speaker_next_train"
    alias: Speaker says the next train
    description: The next trains from Bremen-Burg that pass Bremen Hbf
    triggers:
      - trigger: conversation
        command:
          - "wann (fährt|kommt) der nächste zug"
          - "wann (fährt|kommt) die nächste bahn"
          - "(nächster zug|nächste bahn)"
    actions:
      - action: rest_command.departures_burg
        response_variable: response
        continue_on_error: true
      - variables:
          trains: >-
            {%- set ns = namespace(found=[]) -%}
            {%- for d in (response.content.departures if response is defined and response.status == 200 else []) -%}
              {%- set names = d.route | map(attribute='name') | list -%}
              {%- set here = names.index('Bremen-Burg') if 'Bremen-Burg' in names else -1 -%}
              {%- if here >= 0 and 'Bremen Hbf' in names[here + 1:] and not d.isCancelled -%}
                {%- set at = today_at(d.scheduledDeparture) + timedelta(minutes=d.delayDeparture | int(0)) -%}
                {%- set at = at + timedelta(days=1) if at < now() - timedelta(hours=12) else at -%}
                {%- set ns.found = ns.found + [{'line': d.train | replace('NWB ', ''),
                     'to': d.destination | regex_replace(' *[(][^)]*[)]', '') | regex_replace('^Bremen[- ]', '') | replace('Hbf', 'Hauptbahnhof'),
                     'at': at.hour ~ ' Uhr' ~ (' ' ~ at.minute if at.minute else ''),
                     'in': ((at - now()).total_seconds() / 60) | round(0) | int,
                     'late': d.delayDeparture | int(0), 'platform': d.platform}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.found[:2] }}
      - set_conversation_response: >-
          {%- if trains | count == 0 -%}
            Ich komme gerade nicht an die Züge ab Bremen-Burg.
          {%- else -%}
            {%- set t = trains[0] -%}
            Der nächste Zug zum Hauptbahnhof ist die {{ t.line }} Richtung {{ t.to }} um {{ t.at }},
            {{ 'jetzt' if t.in < 1 else 'in einer Minute' if t.in == 1 else 'in ' ~ t.in ~ ' Minuten' }}
            {{- ', von Gleis ' ~ t.platform if t.platform }}
            {{- ', mit ' ~ ('einer Minute' if t.late == 1 else t.late ~ ' Minuten') ~ ' Verspätung' if t.late > 0 }}.
            {%- if trains | count > 1 %} Danach die {{ trains[1].line }} um {{ trains[1].at }}.{% endif -%}
          {%- endif -%}

  - id: "speaker_next_bus"
    alias: Speaker says the next buses
    description: The next buses from Burgdammer Ring and Goldbergplatz
    triggers:
      - trigger: conversation
        command:
          - "wann (fährt|kommt) der nächste bus"
          - "nächster bus"
    actions:
      - action: rest_command.departures_burgdammer_ring
        response_variable: ring
        continue_on_error: true
      - action: rest_command.departures_goldbergplatz
        response_variable: goldberg
        continue_on_error: true
      - variables:
          buses: >-
            {%- set ns = namespace(found=[]) -%}
            {%- for stop, response in [('Burgdammer Ring', ring if ring is defined else none),
                                        ('Goldbergplatz', goldberg if goldberg is defined else none)] -%}
              {%- for d in (response.content.departures if response and response.status == 200 else []) -%}
                {%- if not d.isCancelled and d.time > now().timestamp() -%}
                  {%- set ns.found = ns.found + [{'line': d.train,
                       'to': d.destination | regex_replace(' *[(][^)]*[)]', '') | regex_replace('^Bremen[- ]', '') | replace('Hbf', 'Hauptbahnhof'),
                       'stop': stop, 'time': d.time, 'in': ((d.time - now().timestamp()) / 60) | round(0) | int}] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ (ns.found | sort(attribute='time'))[:3] }}
      - set_conversation_response: >-
          {%- if buses | count == 0 -%}
            Ich komme gerade nicht an die Busse.
          {%- else -%}
            {%- for b in buses -%}
              {{ b.line }} Richtung {{ b.to }} ab {{ b.stop }} {{ 'jetzt' if b.in < 1 else 'in einer Minute' if b.in == 1 else 'in ' ~ b.in ~ ' Minuten' }}{{ '.' if loop.last else ', ' }}
            {%- endfor -%}
          {%- endif -%}

  - id: "speaker_homelab_status"
    alias: Speaker says how the homelab is
    triggers:
      - trigger: conversation
        command:
          - "läuft das homelab"
          - "ist das homelab (okay|ok|online)"
          - "wie geht es dem homelab"
          - "homelab status"
          - "laufen (die|alle) server"
    actions:
      - action: rest_command.homelab_status
        response_variable: response
        continue_on_error: true
      - set_conversation_response: >-
          {%- if response is not defined or response.status != 200 -%}
            Ich erreiche Gatus gerade nicht.
          {%- else -%}
            {%- set ns = namespace(down=[]) -%}
            {%- for e in response.content if e.results and not (e.results | last).success -%}
              {%- set ns.down = ns.down + [e.name] -%}
            {%- endfor -%}
            {%- if ns.down | count == 0 -%}
              Alle {{ response.content | count }} Dienste laufen.
            {%- else -%}
              {{ ns.down | count }} von {{ response.content | count }} Diensten {{ 'ist' if ns.down | count == 1 else 'sind' }} ausgefallen: {{ ns.down | join(', ') }}.
            {%- endif -%}
          {%- endif -%}

  - id: "speaker_bins"
    alias: Speaker says which bins go out
    triggers:
      - trigger: conversation
        command:
          - "welche tonne (kommt|muss) morgen raus"
          - "welcher müll wird morgen abgeholt"
          - "wann kommt die müllabfuhr"
          - "welche tonne ist als nächstes dran"
          - "müllabfuhr"
    actions:
      - variables:
          words:
            Restmüll: Restmüll
            Bioabfall: Biomüll
            Papier / Gelber Sack: Papier und Gelbe Säcke
            Tannenbaumabfuhr: Tannenbäume
          weekdays: [Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag]
      - set_conversation_response: >-
          {%- set bins = states.sensor.next_bins -%}
          {%- if not bins or bins.attributes.daysTo is not defined -%}
            Ich kenne die Abholtage noch nicht.
          {%- else -%}
            {%- set ns = namespace(said=[]) -%}
            {%- for kind in bins.state.split(', ') -%}
              {%- set ns.said = ns.said + [words.get(kind, kind)] -%}
            {%- endfor -%}
            {%- set said = ns.said | join(' und ') -%}
            {%- set days = bins.attributes.daysTo | int -%}
            {%- if days == 0 -%} Heute wird abgeholt: {{ said }}.
            {%- elif days == 1 -%} Morgen wird abgeholt: {{ said }}.
            {%- elif days < 7 -%} Morgen nichts. Als Nächstes am {{ weekdays[(now() + timedelta(days=days)).weekday()] }}: {{ said }}.
            {%- else -%} Morgen nichts. Als Nächstes in {{ days }} Tagen: {{ said }}.
            {%- endif -%}
          {%- endif -%}

  - id: "speaker_crafty_battery"
    alias: Speaker says the Crafty's battery
    triggers:
      - trigger: conversation
        command:
          - "wie voll ist (mein|der) crafty"
          - "ist (mein|der) crafty (geladen|voll)"
          - "crafty akku"
    actions:
      - set_conversation_response: >-
          {%- set crafty = states('sensor.speaker_crafty_battery') -%}
          {%- if crafty | is_number -%}
            Dein Crafty ist bei {{ crafty | int }} Prozent.
          {%- else -%}
            Von deinem Crafty habe ich noch nichts gehört.
          {%- endif -%}

  - id: "speaker_good_night"
    alias: Speaker says good night
    triggers:
      - trigger: conversation
        command: "gute nacht"
    actions:
      - action: script.turn_off
        target:
          entity_id: script.speaker_lamps_off_later
      - action: script.turn_on
        target:
          entity_id: script.speaker_good_night
      - set_conversation_response: Gute Nacht. Die Lampen gehen in zehn Minuten aus.

  - id: "speaker_good_morning"
    alias: Speaker says good morning
    description: The Day scene, the weather, and the next train
    triggers:
      - trigger: conversation
        command:
          - "guten morgen"
          - "moin [moin]"
    actions:
      - action: script.turn_off
        target:
          entity_id: [script.speaker_good_night, script.speaker_lamps_off_later]
      - action: scene.turn_on
        target:
          entity_id: scene.day
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: forecast
        continue_on_error: true
      - action: rest_command.departures_burg
        response_variable: response
        continue_on_error: true
      - variables:
          words: &weather_words
            clear-night: klar
            cloudy: bewölkt
            exceptional: ungewöhnliches Wetter
            fog: Nebel
            hail: Hagel
            lightning: Gewitter
            lightning-rainy: Gewitter und Regen
            partlycloudy: teilweise bewölkt
            pouring: starker Regen
            rainy: Regen
            snowy: Schnee
            snowy-rainy: Schneeregen
            sunny: sonnig
            windy: windig
            windy-variant: windig und bewölkt
          today: >-
            {{ forecast['weather.forecast_home'].forecast[0]
               if forecast is defined and forecast['weather.forecast_home'] is defined else none }}
          train: >-
            {%- set ns = namespace(found=none) -%}
            {%- for d in (response.content.departures if response is defined and response.status == 200 else []) -%}
              {%- set names = d.route | map(attribute='name') | list -%}
              {%- set here = names.index('Bremen-Burg') if 'Bremen-Burg' in names else -1 -%}
              {%- if ns.found is none and here >= 0 and 'Bremen Hbf' in names[here + 1:] and not d.isCancelled -%}
                {%- set at = today_at(d.scheduledDeparture) + timedelta(minutes=d.delayDeparture | int(0)) -%}
                {%- set ns.found = {'line': d.train | replace('NWB ', ''),
                     'at': at.hour ~ ' Uhr' ~ (' ' ~ at.minute if at.minute else ''),
                     'in': ((at - now()).total_seconds() / 60) | round(0) | int} -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.found }}
      - set_conversation_response: >-
          Guten Morgen.
          {%- set w = states.weather.forecast_home -%}
          {%- if w %} Draußen sind es {{ w.attributes.temperature | round(0) | int }} Grad, {{ words.get(w.state, w.state) }}
            {%- if today %}, heute bis {{ today.temperature | round(0) | int }} Grad
              {%- if today.precipitation_probability is defined and today.precipitation_probability >= 50 %}, wahrscheinlich Regen{% endif -%}
            {%- endif %}.
          {%- endif -%}
          {%- if train %} Die nächste Bahn zum Hauptbahnhof ist die {{ train.line }} um {{ train.at }}, in {{ train.in }} Minuten.{% endif -%}

  # the bedroom lamps: dimmer and brighter in steps, a reading light, and off later
  - id: "speaker_lamps_dimmer"
    alias: Speaker dims the lamps
    triggers:
      - trigger: conversation
        command:
          - "[(mach|mache) [das] (licht|die lampen)] dunkler"
          - "(licht|lampen) dunkler"
    actions:
      - variables:
          lit: "{{ ['light.bed_light', 'light.table_light', 'light.tv_stand_lamp'] | select('is_state', 'on') | list }}"
      - if:
          - "{{ lit | count == 0 }}"
        then:
          - set_conversation_response: Die Lampen sind schon aus.
        else:
          # a lamp below 25% goes off
          - action: light.turn_on
            target:
              entity_id: "{{ lit }}"
            data:
              brightness_step_pct: -25
          - set_conversation_response: Okay.

  - id: "speaker_lamps_brighter"
    alias: Speaker brightens the lamps
    triggers:
      - trigger: conversation
        command:
          - "[(mach|mache) [das] (licht|die lampen)] heller"
          - "(licht|lampen) heller"
    actions:
      # the lamps that are on, or all of them from off
      - variables:
          lamps: [light.bed_light, light.table_light, light.tv_stand_lamp]
          lit: "{{ lamps | select('is_state', 'on') | list }}"
      - action: light.turn_on
        target:
          entity_id: "{{ lit if lit | count > 0 else lamps }}"
        data:
          brightness_step_pct: 25
      - set_conversation_response: Okay.

  - id: "speaker_reading_light"
    alias: Speaker turns on the reading light
    description: The bed lamp bright and neutral white, the other lamps off
    triggers:
      - trigger: conversation
        command:
          - "leselicht"
          - "[(mach|mache|schalt|schalte)] [das] leselicht an"
          - "ich (will|möchte) lesen"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.bed_light
        data:
          brightness_pct: 100
          color_temp_kelvin: 4000
      - action: light.turn_off
        target:
          entity_id: [light.table_light, light.tv_stand_lamp]
      - set_conversation_response: Viel Spaß beim Lesen.

  - id: "speaker_lamps_off_later"
    alias: Speaker turns the lamps off later
    triggers:
      - trigger: conversation
        command:
          - "[(mach|mache|schalt|schalte)] [das] licht in ((fünf|zehn|fünfzehn|zwanzig|dreißig|fünfundvierzig) minuten|einer [halben] stunde) aus"
          - "licht aus in ((fünf|zehn|fünfzehn|zwanzig|dreißig|fünfundvierzig) minuten|einer [halben] stunde)"
    actions:
      # the sentence names the minutes in words; the longer words first, so
      # "fünfzehn" isn't read as "fünf"
      - variables:
          minutes: >-
            {%- set found = trigger.sentence | lower
                 | regex_findall('fünfundvierzig|fünfzehn|fünf|zehn|zwanzig|dreißig|halben stunde|stunde') -%}
            {%- set values = {'fünf': 5, 'zehn': 10, 'fünfzehn': 15, 'zwanzig': 20, 'dreißig': 30,
                 'fünfundvierzig': 45, 'halben stunde': 30, 'stunde': 60} -%}
            {{ values[found[0]] if found else 30 }}
      - action: script.turn_on
        target:
          entity_id: script.speaker_lamps_off_later
        data:
          variables:
            minutes: "{{ minutes }}"
      - set_conversation_response: >-
          Okay, die Lampen gehen {{ 'in einer Stunde' if minutes == 60 else 'in einer halben Stunde' if minutes == 30
          else 'in ' ~ minutes ~ ' Minuten' }} aus.

  - id: "speaker_lamps_stay_on"
    alias: Speaker keeps the lamps on
    description: Cancels "Licht aus in …" and "gute Nacht"'s wait
    triggers:
      - trigger: conversation
        command:
          - "(lass|lasse) [das] licht an"
          - "licht anlassen"
    actions:
      - action: script.turn_off
        target:
          entity_id: [script.speaker_lamps_off_later, script.speaker_good_night]
      - set_conversation_response: Okay, das Licht bleibt an.

  # the phone
  - id: "speaker_find_phone"
    alias: Speaker rings the phone
    description: The phone says "Hier bin ich" at full alarm volume, even on silent
    triggers:
      - trigger: conversation
        command:
          - "wo ist mein handy"
          - "(finde|such|suche) mein handy"
          - "(lass|lasse) mein handy klingeln"
    actions:
      - action: notify.mobile_app_pixel_9_pro_xl
        data:
          message: TTS
          data:
            tts_text: Hier bin ich!
            media_stream: alarm_stream_max
        continue_on_error: true
      - set_conversation_response: Dein Handy klingelt.

  - id: "speaker_phone_battery"
    alias: Speaker says the phone's battery
    triggers:
      - trigger: conversation
        command:
          - "wie voll ist mein handy"
          - "wie viel akku hat mein handy"
          - "ist mein handy (geladen|voll)"
          - "handy akku"
    actions:
      - set_conversation_response: >-
          {%- set level = states('sensor.pixel_9_pro_xl_battery_level_2') -%}
          {%- if level | is_number -%}
            Dein Handy ist bei {{ level | int }} Prozent{{ ' und lädt' if is_state('binary_sensor.pixel_9_pro_xl_is_charging_2', 'on') }}.
          {%- else -%}
            Ich weiß gerade nicht, wie voll dein Handy ist.
          {%- endif -%}

  # the weather ahead and the sun; "wie ist das Wetter" for now is Assist's own
  - id: "speaker_weather_tomorrow"
    alias: Speaker says tomorrow's weather
    triggers:
      - trigger: conversation
        command:
          - "wie wird das wetter morgen"
          - "wie ist das wetter morgen"
          - "wetter morgen"
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: forecast
        continue_on_error: true
      - variables:
          words: *weather_words
          tomorrow: >-
            {%- set day = (now() + timedelta(days=1)).date() -%}
            {%- set ns = namespace(found=none) -%}
            {%- for f in (forecast['weather.forecast_home'].forecast
                          if forecast is defined and forecast['weather.forecast_home'] is defined else []) -%}
              {%- if ns.found is none and as_local(as_datetime(f.datetime)).date() == day -%}
                {%- set ns.found = f -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.found }}
      - set_conversation_response: >-
          {%- if not tomorrow -%}
            Ich habe gerade keine Vorhersage für morgen.
          {%- else -%}
            Morgen {{ words.get(tomorrow.condition, tomorrow.condition) }},
            {%- if tomorrow.templow is defined %} {{ tomorrow.templow | round(0) | int }} bis{% endif %}
            {{- ' ' ~ tomorrow.temperature | round(0) | int }} Grad
            {%- set rain = tomorrow.precipitation_probability | default(0) | round(0) | int -%}
            {{- ', Regenrisiko ' ~ rain ~ ' Prozent' if rain >= 20 }}.
          {%- endif -%}

  - id: "speaker_rain_today"
    alias: Speaker says whether it rains today
    description: The rest of the day, and at least the next six hours
    triggers:
      - trigger: conversation
        command:
          - "regnet es heute"
          - "wird es heute regnen"
          - "gibt es heute regen"
          - "brauche ich einen regenschirm"
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: hourly
        response_variable: forecast
        continue_on_error: true
      - variables:
          rain: >-
            {%- set end = [today_at('23:59'), now() + timedelta(hours=6)] | max -%}
            {%- set ns = namespace(most=0, first=none) -%}
            {%- for f in (forecast['weather.forecast_home'].forecast
                          if forecast is defined and forecast['weather.forecast_home'] is defined else []) -%}
              {%- set at = as_local(as_datetime(f.datetime)) -%}
              {%- set chance = f.precipitation_probability | default(0) | round(0) | int -%}
              {%- if at <= end -%}
                {%- set ns.most = [ns.most, chance] | max -%}
                {%- if ns.first is none and chance >= 50 -%}
                  {%- set ns.first = at.hour -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ {'most': ns.most, 'first': ns.first, 'known': forecast is defined} }}
      - set_conversation_response: >-
          {%- if states('weather.forecast_home') in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy'] -%}
            Ja, es regnet gerade.
          {%- elif not rain.known -%}
            Ich habe gerade keine Vorhersage.
          {%- elif rain.first is not none -%}
            Ja, ab {{ rain.first }} Uhr wird es wahrscheinlich regnen, das Risiko liegt bei bis zu {{ rain.most }} Prozent.
          {%- elif rain.most >= 20 -%}
            Vielleicht, das Regenrisiko liegt bei bis zu {{ rain.most }} Prozent.
          {%- else -%}
            Nein, es bleibt trocken.
          {%- endif -%}

  - id: "speaker_sun"
    alias: Speaker says when the sun rises or sets
    triggers:
      - trigger: conversation
        id: setting
        command:
          - "wann geht die sonne unter"
          - "wann ist sonnenuntergang"
          - "sonnenuntergang"
      - trigger: conversation
        id: rising
        command:
          - "wann geht die sonne auf"
          - "wann ist sonnenaufgang"
          - "sonnenaufgang"
    actions:
      - set_conversation_response: >-
          {%- set at = as_local(as_datetime(state_attr('sun.sun', 'next_' ~ trigger.id))) -%}
          Die Sonne geht {{ 'heute' if at.date() == now().date() else 'morgen' }} um {{ at.hour }} Uhr
          {{- ' ' ~ at.minute if at.minute }} {{ 'unter' if trigger.id == 'setting' else 'auf' }}.

  # "Was kannst du?" names the topics; "Was kannst du mit dem Licht machen?"
  # and the like name the sentences for one. Keep these in step with the
  # sentences above and Assist's own
  - id: "speaker_help"
    alias: Speaker says what it can do
    triggers:
      - trigger: conversation
        id: overview
        command:
          - "was kannst du [alles] [machen|tun]"
          - "wobei kannst du [mir] helfen"
          - "was kann ich dich fragen"
          - "hilfe"
      - trigger: conversation
        id: more
        command:
          - "was kannst du (sonst|noch|sonst noch) [machen|tun]"
          - "was noch"
      - trigger: conversation
        id: lights
        command:
          - "was kannst du (mit|zu|bei|beim|zum) [dem|den|der] (licht|lampen|beleuchtung) [machen|tun|sagen]"
          - "was kann ich (zu|zum|zur|zu den) (licht|lampen|beleuchtung) sagen"
          - "hilfe (zu|zum|zur|für|für das|für die) (licht|lampen|beleuchtung)"
      - trigger: conversation
        id: transit
        command:
          - "was kannst du (mit|zu|bei|beim|zum|zur) [dem|den|der] (zug|zügen|bahn|bus|bussen) [machen|tun|sagen]"
          - "was kann ich (zu|zum|zur|zu den) (zug|zügen|bahn|bus|bussen) sagen"
          - "hilfe (zu|zum|zur|für|für den|für die) (zug|zügen|bahn|bus|bussen)"
      - trigger: conversation
        id: weather
        command:
          - "was kannst du (mit|zu|bei|beim|zum|zur) [dem|der] (wetter|sonne) [machen|tun|sagen]"
          - "was kann ich (zu|zum|zur) (wetter|sonne) sagen"
          - "hilfe (zu|zum|zur|für|für das|für die) (wetter|sonne)"
      - trigger: conversation
        id: bins
        command:
          - "was kannst du (mit|zu|bei|beim|zum|zur) [dem|den|der] (müll|müllabfuhr|tonnen|mülltonnen) [machen|tun|sagen]"
          - "was kann ich (zu|zum|zur|zu den) (müll|müllabfuhr|tonnen|mülltonnen) sagen"
          - "hilfe (zu|zum|zur|für|für den|für die) (müll|müllabfuhr|tonnen|mülltonnen)"
      - trigger: conversation
        id: timers
        command:
          - "was kannst du (mit|zu|bei|beim|zum) [dem|den] (timer|timern) [machen|tun|sagen]"
          - "was kann ich (zu|zum|zu den) (timer|timern) sagen"
          - "hilfe (zu|zum|für|für den|für die) (timer|timern)"
      - trigger: conversation
        id: phone
        command:
          - "was kannst du (mit|zu|bei|beim|zum) [dem|meinem] handy [machen|tun|sagen]"
          - "was kann ich (zu|zum|zu meinem) handy sagen"
          - "hilfe (zu|zum|für|für das|für mein) handy"
      - trigger: conversation
        id: keys
        command:
          - "was machen (die|deine) (tasten|knöpfe)"
          - "was macht (der|dein) knopf"
          - "hilfe (zu|zu den|für die) (tasten|knöpfen)"
      - trigger: conversation
        id: colours
        command:
          - "was bedeuten (die|deine) farben"
          - "was bedeutet (die|deine) farbe"
          - "was zeigt dein (ring|licht)"
    actions:
      - variables:
          answers:
            overview: >-
              Ich kann das Licht steuern, Timer stellen und dein Handy finden. Ich sage dir die nächsten
              Züge und Busse, das Wetter und welche Tonne raus muss. Frag zum Beispiel: Was kannst du mit
              dem Licht machen? Oder: Was kannst du sonst noch?
            more: >-
              Ich sage dir, ob das Homelab läuft und wie voll dein Crafty ist. Bei Guten Morgen mache ich
              das Licht hell und sage dir das Wetter und den nächsten Zug. Bei Gute Nacht dimme ich die
              Lampen und mache sie nach zehn Minuten aus. Und frag mich nach meinen Tasten oder den Farben
              meines Rings.
            lights: >-
              Beim Licht kannst du sagen: Licht an oder aus, dunkler, heller, Leselicht, stell die
              Lichter auf rot, oder stell die Helligkeit auf 50 Prozent. Auch: Licht aus in zwanzig
              Minuten, und Licht anlassen, wenn du es dir anders überlegst. Die Lampen heißen Bettlampe,
              Tischlampe und Fernsehlampe, zum Beispiel: Schalte die Bettlampe aus. Und: Aktiviere die
              Nacht Szene.
            transit: >-
              Frag: Wann fährt der nächste Zug? Dann nenne ich dir die nächsten Bahnen ab Burg zum
              Hauptbahnhof. Oder: Wann fährt der nächste Bus? Dann nenne ich die Busse ab Burgdammer Ring
              und Goldbergplatz.
            weather: >-
              Frag: Wie ist das Wetter? Wie wird das Wetter morgen? Regnet es heute? Oder: Wann geht die
              Sonne unter?
            bins: >-
              Frag: Welche Tonne muss morgen raus? Am Nachmittag vor der Abholung leuchtet mein Ring
              außerdem in der Farbe der Tonne.
            timers: >-
              Sag: Stelle einen Timer auf zehn Minuten. Oder: Wie lange läuft der Timer noch? Und: Stoppe
              den Timer. Mein Ring zeigt in gelb, wie viel Zeit noch bleibt. Wenn er klingelt, sag einfach
              Stopp.
            phone: >-
              Frag: Wo ist mein Handy? Dann klingelt es laut, auch wenn es stumm ist. Oder: Wie voll ist
              mein Handy?
            keys: >-
              Drück die Aktionstaste einmal, um mit mir zu sprechen oder mich zu unterbrechen, zweimal, um
              die Lampen an oder aus zu machen, und halte sie, um mein Mikrofon stumm zu schalten. Die
              anderen beiden Tasten machen mich lauter und leiser.
            colours: >-
              Wenn ich still bin, zeigt mein Ring: weiß, grün, oder blau und gelb für die Tonne, die
              morgen raus muss; lila, wenn im Homelab etwas ausgefallen ist; orange, wenn dein Crafty fast
              leer ist, und türkis, wenn er voll ist. Blau heißt, ich höre zu, und ein roter Punkt, dass
              mein Mikrofon stumm ist.
      - set_conversation_response: "{{ answers[trigger.id] }}"

  # the ring shows these too; said aloud only in the day
  - id: "speaker_crafty_announcements"
    alias: Speaker announces the Crafty's battery
    triggers:
      - trigger: numeric_state
        entity_id: sensor.speaker_crafty_battery
        above: 99
        id: charged
      - trigger: numeric_state
        entity_id: sensor.speaker_crafty_battery
        below: 16
        id: low
    conditions:
      - condition: time
        after: "08:00:00"
        before: "22:00:00"
    actions:
      - action: assist_satellite.announce
        target:
          entity_id: assist_satellite.speaker_assist_satellite
        data:
          message: >-
            {{ 'Dein Crafty ist voll geladen.' if trigger.id == 'charged'
               else 'Der Akku von deinem Crafty ist fast leer.' }}
          preannounce: false
